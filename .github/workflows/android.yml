name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The action's old default requests Google's retired "tools" package.
          # Install only the SDK packages used by this Capacitor/AGP build.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Check cloud configuration
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo '::error::Set repository variables VITE_SUPABASE_URL and VITE_SUPABASE_PUBLISHABLE_KEY so the APK uses the existing backend.'
            exit 1
          fi
      - name: Restore persistent debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo '::error::Set ANDROID_DEBUG_KEYSTORE_BASE64 to keep APK signatures consistent between builds.'
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          printf '%s  %s\n' '7bac8c61299d4efa0388c1621228a8bb07d604de029c806c1c6f23c0037ee91d' "$HOME/.android/debug.keystore" | sha256sum --check --status
          echo 'Persistent signing keystore checksum verified.'
      - run: npm ci
      - run: npm run lint
      - run: npm run android:apk
      - name: Verify APK signing certificate
        shell: bash
        run: |
          apk_path='android/app/build/outputs/apk/debug/app-debug.apk'
          cert_report="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk_path")"
          cert_sha="$(printf '%s\n' "$cert_report" | awk '/Signer #1 certificate SHA-256 digest:/ { print $NF }')"
          if [ "$cert_sha" != '265fa620c4cfef89986560ddd4c7c66c30237a91f4da91a432272c8208476117' ]; then
            echo '::error::APK certificate differs from the published 2.0.0 APK. Refusing to upload an incompatible update.'
            exit 1
          fi
          echo "APK signing certificate verified: $cert_sha"
      - uses: actions/upload-artifact@v4
        with:
          name: exam-prep-king-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
